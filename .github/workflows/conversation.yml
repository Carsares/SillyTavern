name: Conversation v1
on:
  pull_request:
    paths:
      - 'src/conversation/**'
      - 'public/shared/conversation/**'
      # Agent is mounted in the original server and hosted by Modern pages.
      - 'public/modern/**'
      - 'tests/conversation/**'
      - 'tests/modern-agent-workspace.test.mjs'
      - 'server.js'
      - 'conversation-server.js'
      - 'src/workspace-bootstrap.js'
      - 'src/server-main.js'
      - 'src/server-exit.js'
      - 'src/server-global.js'
      - 'src/server-directory.js'
      - 'src/command-line.js'
      - 'src/endpoints/users-admin.js'
      - 'src/endpoints/users-private.js'
      - 'src/character-card-parser.js'
      - 'src/png/**'
      - 'src/tokenizers/**'
      - 'package*.json'
      - '.github/workflows/conversation.yml'
  # Changes are committed directly to master (see AGENTS.md), so pushes run the same path-filtered checks.
  push:
    branches: [master]
    paths:
      - 'src/conversation/**'
      - 'public/shared/conversation/**'
      # Agent is mounted in the original server and hosted by Modern pages.
      - 'public/modern/**'
      - 'tests/conversation/**'
      - 'tests/modern-agent-workspace.test.mjs'
      - 'server.js'
      - 'conversation-server.js'
      - 'src/workspace-bootstrap.js'
      - 'src/server-main.js'
      - 'src/server-exit.js'
      - 'src/server-global.js'
      - 'src/server-directory.js'
      - 'src/command-line.js'
      - 'src/endpoints/users-admin.js'
      - 'src/endpoints/users-private.js'
      - 'src/character-card-parser.js'
      - 'src/png/**'
      - 'src/tokenizers/**'
      - 'package*.json'
      - '.github/workflows/conversation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint:conversation
      - run: npm run test:conversation:unit
      - run: npm run test:conversation:integration
      # Integration peers are deterministic local servers. No account secrets,
      # existing user data or paid model credentials are provided to this job.
