services:
  conversation:
    build: ..
    image: conversation-v1:local
    init: true
    environment:
      NODE_ENV: production
      CONVERSATION_PASSWORD: ${CONVERSATION_PASSWORD:?Set a password}
      CONVERSATION_HOST: ${CONVERSATION_HOST:-localhost}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - conversation_v1:/data
    restart: unless-stopped
volumes:
  conversation_v1:
