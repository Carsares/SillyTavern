<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原型 · 会话内图片生成</title>
<style>
:root {
    color-scheme: light;
    --bg: #f4f7fb; --surface: #ffffff; --surface-muted: #f7f9fc; --surface-strong: #e8eef6;
    --text: #171b22; --text-muted: #667085; --border: #d8e0ea; --border-strong: #b9c5d5;
    --accent: #0f766e; --accent-strong: #115e59; --accent-soft: #dff5f1;
    --warning: #b7791f; --danger: #c24141; --success: #287d3c;
    --shadow: 0 18px 44px rgba(18, 26, 36, 0.13); --shadow-soft: 0 8px 24px rgba(18, 26, 36, 0.07);
    --radius: 8px; --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
}
[data-theme="dark"] {
    color-scheme: dark;
    --bg: #101418; --surface: #181d23; --surface-muted: #20262e; --surface-strong: #2a333d;
    --text: #edf2f7; --text-muted: #a5b1bf; --border: #2e3945; --border-strong: #465567;
    --accent: #46c2b4; --accent-strong: #8be2d8; --accent-soft: #163d3a;
    --warning: #e1a858; --danger: #e06c6c; --success: #68c184;
    --shadow: 0 18px 48px rgba(0, 0, 0, 0.36); --shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.22);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; min-width: 1180px; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
.ic { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
.ic.sm { width: 13px; height: 13px; vertical-align: -2px; }
.ic.lg { width: 22px; height: 22px; }

/* ---------- 原型导航条（不属于产品界面） ---------- */
.proto-bar { position: sticky; top: 0; z-index: 60; display: flex; align-items: center; gap: 14px; height: 46px; padding: 0 16px; background: #0b1220; color: #e2e8f0; font-size: 13px; }
.proto-bar strong { font-size: 13px; letter-spacing: .02em; }
.proto-bar .proto-tabs { display: flex; gap: 4px; }
.proto-bar button { border: 1px solid #263247; background: #131c2e; color: #cbd5e1; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.proto-bar button.active { background: #e2e8f0; color: #0b1220; border-color: #e2e8f0; }
.proto-bar select { background: #131c2e; color: #e2e8f0; border: 1px solid #263247; border-radius: 6px; padding: 4px 8px; }
.proto-bar .proto-note { margin-left: auto; color: #94a3b8; }

/* ---------- 应用外壳 ---------- */
.app { display: grid; grid-template-columns: 260px minmax(0, 1fr); height: calc(100vh - 46px); }
.sidebar { border-right: 1px solid var(--border); background: var(--surface); padding: 18px 14px; overflow: auto; }
.brand { display: flex; align-items: center; gap: 12px; padding: 4px 6px 20px; }
.brand-mark { width: 44px; height: 44px; border-radius: 10px; background: #13312d; color: #fff; display: grid; place-items: center; font-weight: 700; }
.brand-title { font-weight: 700; font-size: 16px; }
.brand-sub { color: var(--text-muted); font-size: 12px; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 9px 12px; margin: 2px 0; border-radius: var(--radius); color: var(--text-muted); cursor: pointer; border-left: 3px solid transparent; }
.nav-item:hover { background: var(--surface-muted); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent-strong); border-left-color: var(--accent); font-weight: 600; }
.nav-item .count { margin-left: auto; font-size: 12px; padding: 0 8px; border-radius: 999px; background: var(--surface-muted); border: 1px solid var(--border); }
.workspace { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 12px 22px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--surface) 70%, var(--bg)); }
.search { flex: 1; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text-muted); }
.search kbd { margin-left: auto; font-size: 11px; border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; background: var(--surface-muted); }
.status-pill { display: inline-flex; align-items: center; gap: 7px; min-height: 30px; padding: 3px 11px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 999px; background: var(--success); flex: none; }
.dot.warning { background: var(--warning); } .dot.danger { background: var(--danger); } .dot.muted { background: var(--text-muted); }
.content { flex: 1; min-height: 0; overflow: auto; padding: 20px 22px 22px; }
.content.chat-content { display: flex; flex-direction: column; overflow: hidden; }

.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
.eyebrow { color: var(--text-muted); font-size: 12px; font-weight: 600; }
.page-title { margin: 2px 0 2px; font-size: 26px; line-height: 1.25; }
.page-description { margin: 0; color: var(--text-muted); }
.page-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.icon-button, .primary-button, .secondary-button, .ghost-button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; border-radius: var(--radius); cursor: pointer; white-space: nowrap; transition: background 140ms, border-color 140ms, color 140ms; }
.icon-button { width: 38px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); }
.icon-button.mini { width: 28px; min-height: 28px; }
.primary-button { padding: 0 14px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font-weight: 600; }
[data-theme="dark"] .primary-button { color: #06201d; }
.primary-button:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.secondary-button { padding: 0 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
.secondary-button:hover, .icon-button:hover { border-color: var(--border-strong); color: var(--text); }
.ghost-button { min-height: 28px; padding: 0 8px; border: 1px solid transparent; background: transparent; color: var(--text-muted); font-size: 12px; }
.ghost-button:hover { background: var(--surface-muted); color: var(--text); }
.ghost-button.danger, .secondary-button.danger { color: var(--danger); }
.small { min-height: 30px !important; font-size: 13px; padding: 0 10px; }
button:disabled { cursor: not-allowed !important; opacity: .55; }

.panel { border: 1px solid var(--border); border-radius: calc(var(--radius) + 4px); background: var(--surface); box-shadow: var(--shadow-soft); }
.tag { display: inline-flex; align-items: center; gap: 5px; min-height: 24px; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); font-size: 12px; white-space: nowrap; }
.tag.mini { min-height: 20px; padding: 0 7px; font-size: 11px; }
.tag.accent { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); background: var(--accent-soft); color: var(--accent-strong); }
.tag.warn { border-color: color-mix(in srgb, var(--warning) 45%, transparent); background: color-mix(in srgb, var(--warning) 12%, var(--surface)); color: var(--warning); }
.tag.ok { border-color: color-mix(in srgb, var(--success) 40%, transparent); background: color-mix(in srgb, var(--success) 12%, var(--surface)); color: var(--success); }

.segmented-control { display: inline-grid; grid-auto-flow: column; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: var(--radius); background: color-mix(in srgb, var(--surface-muted) 82%, var(--surface)); }
.segmented-control button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 32px; padding: 0 14px; border: 0; border-radius: 5px; background: transparent; color: var(--text-muted); cursor: pointer; }
.segmented-control button.active { background: var(--surface); color: var(--text); box-shadow: 0 2px 8px rgba(18, 26, 36, .08); font-weight: 600; }
.segmented-control.compact button { min-height: 24px; padding: 0 10px; font-size: 12px; }

.text-input, .select-input, textarea.text-input { width: 100%; min-height: 38px; padding: 8px 11px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); }
.text-input:focus, .select-input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
.field-label { display: block; margin-bottom: 5px; font-size: 12px; font-weight: 600; color: var(--text-muted); }
.field-hint { margin-top: 4px; font-size: 12px; color: var(--text-muted); }
.field-hint.warn { color: var(--warning); }

/* ---------- 聊天页 ---------- */
.content.chat-content { overflow: auto; }
.chat-content .page-head { margin-bottom: 10px; }
.chat-content .page-title { font-size: 20px; }
.chat-panel { flex: 1; min-height: 640px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; padding: 14px 16px 14px; }
.chat-hero { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.hero-avatar { width: 48px; height: 48px; border-radius: 10px; background: linear-gradient(135deg, #3b3f8f, #9d6bd8 60%, #e9b7d6); color: #fff; display: grid; place-items: center; font-size: 20px; font-weight: 700; flex: none; }
.hero-main { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.hero-title { margin: 0; font-size: 18px; }
.hero-sub { color: var(--text-muted); font-size: 12px; }
.hero-tags { display: flex; gap: 6px; flex-wrap: wrap; flex-basis: 100%; }
.hero-actions { display: flex; gap: 8px; }

.thread { min-height: 300px; display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--radius); background: color-mix(in srgb, var(--surface-muted) 60%, var(--surface)); }
.message-list { flex: 1; min-height: 0; overflow: auto; display: grid; align-content: start; gap: 12px; padding: 0 16px 16px; }
.select-banner { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 10px; margin: 0 -16px; padding: 8px 16px; background: color-mix(in srgb, var(--accent-soft) 92%, var(--surface)); border-bottom: 1px solid color-mix(in srgb, var(--accent) 30%, var(--border)); color: var(--accent-strong); font-size: 13px; }
.select-banner .ghost-button { margin-left: auto; color: var(--accent-strong); }
.list-spacer { height: 4px; }

.message { position: relative; max-width: min(78%, 760px); padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: 0 1px 2px rgba(18, 26, 36, .05); }
.message.user { justify-self: end; background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, var(--border)); }
.message-meta, .message-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; color: var(--text-muted); font-size: 12px; }
.message-foot { margin: 8px 0 0; }
.meta-left { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
.message-meta strong { color: var(--text); }
.message-body p { margin: 0 0 6px; } .message-body p:last-child { margin-bottom: 0; }
.message-body em { color: var(--text-muted); }
.message.selectable { cursor: pointer; }
.message.selectable:hover { border-color: var(--border-strong); }
.message.selected { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 22%, transparent); }
.message.dimmed { opacity: .55; }
.checkbox { width: 16px; height: 16px; border: 1.5px solid var(--border-strong); border-radius: 4px; display: inline-grid; place-items: center; background: var(--surface); color: transparent; flex: none; }
.checkbox .ic { width: 11px; height: 11px; stroke-width: 3; }
.selected .checkbox { background: var(--accent); border-color: var(--accent); color: #fff; }
.message-streaming .stream-text::after { content: ''; display: inline-block; width: 7px; height: 1em; margin-left: 2px; vertical-align: text-bottom; background: var(--accent); animation: caret 1s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }

/* 图片消息 */
.message.image-message { max-width: min(78%, 520px); }
.media-frame { position: relative; display: inline-block; max-width: 100%; }
.media-frame img { display: block; max-width: 100%; max-height: 360px; border-radius: var(--radius); cursor: zoom-in; background: var(--surface-muted); }
.media-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.media-grid img { width: 100%; max-height: 240px; object-fit: cover; }
.variant-switch { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-muted); }
.media-overlay { position: absolute; inset: 0; border-radius: var(--radius); display: grid; place-items: center; background: color-mix(in srgb, var(--surface) 55%, transparent); backdrop-filter: blur(2px); color: var(--text); font-size: 13px; }
.prompt-details { margin-top: 8px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-muted); }
.prompt-details summary { cursor: pointer; padding: 6px 10px; font-size: 12px; color: var(--text-muted); list-style: none; display: flex; gap: 6px; align-items: center; }
.prompt-details summary::-webkit-details-marker { display: none; }
.prompt-details[open] summary .chev { transform: rotate(90deg); }
.prompt-details .prompt-text { padding: 0 10px 8px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; color: var(--text); }
.image-info { margin-top: 8px; font-size: 12px; color: var(--text-muted); }
.image-actions { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border); }
.delete-confirm { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--danger); }

/* 生成中 / 失败 / 未知 卡片 */
.skeleton { width: min(340px, 100%); border-radius: var(--radius); background: linear-gradient(90deg, var(--surface-muted) 0%, var(--surface-strong) 50%, var(--surface-muted) 100%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; display: grid; place-items: center; color: var(--text-muted); font-size: 13px; text-align: center; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.job-card.failed { border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); background: color-mix(in srgb, var(--danger) 5%, var(--surface)); }
.job-card.unknown { border-color: color-mix(in srgb, var(--warning) 50%, var(--border)); background: color-mix(in srgb, var(--warning) 6%, var(--surface)); }
.job-title { display: flex; align-items: center; gap: 7px; font-weight: 600; margin-bottom: 4px; }
.job-card.failed .job-title { color: var(--danger); } .job-card.unknown .job-title { color: var(--warning); }
.job-text { font-size: 13px; color: var(--text-muted); }
.job-text code { font-family: var(--mono); font-size: 12px; background: var(--surface-muted); padding: 1px 5px; border-radius: 4px; color: var(--text); }

/* 输入框 */
.composer { position: relative; display: grid; gap: 8px; margin-top: 10px; padding: 8px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: 0 1px 2px rgba(18, 26, 36, .05); }
.composer.image-mode { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 9%, transparent); }
.composer-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; }
.composer textarea { width: 100%; min-height: 46px; max-height: 200px; resize: none; padding: 11px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); }
.composer-buttons { display: flex; gap: 8px; align-items: flex-end; }
.composer-top { display: flex; align-items: center; gap: 10px; }
.composer-top .hint { color: var(--text-muted); font-size: 12px; }
.composer-status { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
.composer-status.warn { color: var(--warning); }
.composer-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.composer-meta .usage { margin-left: auto; font-size: 12px; color: var(--text-muted); }
.mode-toggle button { gap: 5px; }
.connection-chip { display: inline-flex; align-items: center; gap: 7px; max-width: 420px; min-height: 28px; padding: 2px 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--text-muted); font-size: 12px; cursor: pointer; }
.connection-chip:hover { border-color: var(--border-strong); color: var(--text); }
.connection-chip.image { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); color: var(--accent-strong); background: var(--accent-soft); }
.chip-popover { position: absolute; left: 8px; bottom: calc(100% + 8px); z-index: 20; width: 340px; padding: 14px; border: 1px solid var(--border); border-radius: calc(var(--radius) + 2px); background: var(--surface); box-shadow: var(--shadow); }
.chip-popover h4 { margin: 0 0 8px; font-size: 14px; }
.kv { display: grid; grid-template-columns: 84px 1fr; gap: 6px 10px; font-size: 13px; margin-bottom: 12px; }
.kv span:nth-child(odd) { color: var(--text-muted); }

.stepper { display: flex; align-items: center; gap: 8px; padding: 2px 2px 0; }
.step { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); white-space: nowrap; }
.step .num { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--border-strong); display: grid; place-items: center; font-size: 11px; background: var(--surface); }
.step.active { color: var(--text); font-weight: 600; }
.step.active .num { background: var(--accent); border-color: var(--accent); color: #fff; }
.step.done { color: var(--accent-strong); }
.step.done .num { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-strong); }
.step-line { flex: 0 0 26px; height: 1px; background: var(--border-strong); }
.select-box { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px dashed color-mix(in srgb, var(--accent) 45%, var(--border)); border-radius: var(--radius); background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface)); }
.select-summary { font-size: 13px; }
.select-summary strong { font-size: 15px; color: var(--accent-strong); }
.select-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; font-size: 12px; color: var(--text-muted); }
.switch { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; color: var(--text); }
.switch .knob { width: 28px; height: 16px; border-radius: 999px; background: var(--border-strong); position: relative; transition: background 140ms; }
.switch .knob::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: left 140ms; }
.switch.on .knob { background: var(--accent); } .switch.on .knob::after { left: 14px; }
.progress-box { display: flex; align-items: center; gap: 12px; padding: 14px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-muted); font-size: 13px; }
.spinner-ring { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border-strong); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.prompt-source { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
.prompt-source .tag { color: var(--accent-strong); }
.param-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.param { display: inline-flex; align-items: center; gap: 4px; min-height: 28px; padding: 0 4px 0 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-muted); font-size: 12px; color: var(--text-muted); }
.param select { border: 0; background: transparent; color: var(--text); font-size: 12px; padding: 3px 2px; cursor: pointer; }
.param select:focus { outline: none; }
.param-note { font-size: 12px; color: var(--text-muted); margin-left: 4px; }
.advanced-box { display: grid; grid-template-columns: minmax(0, 1fr) 140px 120px; gap: 10px; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-muted); }
.advanced-box textarea { min-height: 38px; height: 38px; }
.empty-composer { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 14px; border: 1px dashed var(--border-strong); border-radius: var(--radius); background: var(--surface-muted); }
.empty-composer .icon-wrap { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-strong); }
.empty-composer p { margin: 2px 0 0; font-size: 12px; color: var(--text-muted); }
.text-mode-row textarea { min-height: 46px; }

/* ---------- API 页 ---------- */
.api-tabs { margin: -4px 0 16px; }
.api-grid { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
.panel-pad { padding: 18px; }
.panel-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.panel-title { margin: 0; font-size: 15px; }
.panel-subtitle { margin: 2px 0 0; color: var(--text-muted); font-size: 12px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.tile { padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-muted); }
.tile span { display: block; font-size: 12px; color: var(--text-muted); }
.tile strong { font-family: var(--mono); font-size: 13px; }
.form-section { margin-top: 12px; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius); }
.form-section h4 { margin: 0; font-size: 13px; }
.form-section > p { margin: 2px 0 12px; color: var(--text-muted); font-size: 12px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.form-grid .full { grid-column: 1 / -1; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 6px; padding: 3px 9px; font-size: 12px; cursor: pointer; font-weight: 600; }
.chip-btn:hover { border-color: var(--accent); color: var(--accent-strong); }
.field.disabled { opacity: .55; }
.form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.diag-item { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; padding: 11px 12px; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; }
.diag-item .ok { color: var(--success); } .diag-item .warn { color: var(--warning); } .diag-item .muted { color: var(--text-muted); }
.diag-item b { font-size: 13px; }
.diag-item small { display: block; color: var(--text-muted); font-size: 12px; }
.diag-item .state { font-size: 12px; color: var(--text-muted); }
.history-row { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding: 6px 0; border-top: 1px dashed var(--border); color: var(--text-muted); }
.history-row:first-child { border-top: 0; }

/* ---------- 交互说明页 ---------- */
.spec { max-width: 980px; }
.spec section { margin-bottom: 16px; padding: 18px 20px; }
.spec h2 { margin: 0 0 10px; font-size: 18px; }
.spec h3 { margin: 14px 0 6px; font-size: 14px; }
.spec p, .spec li { color: var(--text); }
.spec ol, .spec ul { margin: 6px 0; padding-left: 22px; }
.spec li { margin: 3px 0; }
.spec table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 13px; }
.spec th, .spec td { text-align: left; vertical-align: top; padding: 8px 10px; border-top: 1px solid var(--border); }
.spec th { color: var(--text-muted); font-weight: 600; background: var(--surface-muted); }
.spec code { font-family: var(--mono); font-size: 12px; background: var(--surface-muted); border: 1px solid var(--border); padding: 0 5px; border-radius: 4px; }
.spec .muted { color: var(--text-muted); }

/* ---------- 浮层 ---------- */
.lightbox { position: fixed; inset: 0; z-index: 80; display: grid; grid-template-columns: minmax(0, 1fr) 360px; background: rgba(8, 12, 18, .82); }
.lightbox-stage { display: grid; place-items: center; padding: 32px; min-width: 0; }
.lightbox-stage img { max-width: 100%; max-height: calc(100vh - 64px); border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.lightbox-side { background: var(--surface); padding: 20px; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.lightbox-side h3 { margin: 0; font-size: 16px; }
.lightbox-side .prompt-text { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-muted); }
.lightbox-side .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
.toast { position: fixed; right: 20px; bottom: 20px; z-index: 90; max-width: 420px; padding: 10px 14px; border-radius: var(--radius); background: #111827; color: #f3f4f6; font-size: 13px; box-shadow: var(--shadow); animation: toast-in 160ms ease-out; }
@keyframes toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    g.fillStyle = '#07090f'; g.beginPath(); g.moveTo(0, h * .84); g.lineTo(w, h * .8); g.lineTo(w, h); g.lineTo(0, h); g.fill();
    g.strokeStyle = '#0b0e16'; g.lineWidth = 3; g.beginPath(); g.moveTo(0, h * .78); g.lineTo(w, h * .74); g.stroke();
    for (let x = 10; x < w; x += 26) { g.beginPath(); g.moveTo(x, h * .78 - (x / w) * h * .04); g.lineTo(x, h * .84 - (x / w) * h * .04); g.stroke(); }
    const fx = w * (.3 + r() * .4), fy = h * .82, s = h * .24;
    g.fillStyle = '#05070c';
    g.beginPath(); g.ellipse(fx, fy - s * .95, s * .1, s * .12, 0, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.moveTo(fx - s * .1, fy - s * .82); g.lineTo(fx + s * .1, fy - s * .82); g.lineTo(fx + s * .3, fy); g.lineTo(fx - s * .26, fy); g.closePath(); g.fill();
    g.strokeStyle = 'rgba(214,220,240,.45)'; g.lineWidth = 1.1;
    for (let k = 0; k < 9; k++) { g.beginPath(); g.moveTo(fx - s * .05 + k * s * .012, fy - s * 1.02); g.quadraticCurveTo(fx + s * .25, fy - s * .95 + k * 2, fx + s * (.38 + r() * .22), fy - s * (.72 + r() * .18)); g.stroke(); }
    const url = c.toDataURL('image/png');
    paintCache.set(key, url);
    return url;
}

/* ---------- 渲染：外壳 ---------- */
function render() {
    const list = document.querySelector('.message-list');
    const prevTop = list?.scrollTop ?? 0;
    const nearBottom = list ? list.scrollHeight - list.scrollTop - list.clientHeight < 60 : true;
    const content = document.querySelector('.content');
    const prevContentTop = content?.scrollTop ?? 0;
    const prevPage = document.querySelector('[data-page-key]')?.dataset.pageKey;

    document.documentElement.dataset.theme = S.theme;
    document.getElementById('root').innerHTML = protoBar() + `<div class="app">${sidebar()}<div class="workspace">${topbar()}${
        S.page === 'chat' ? chatPage() : S.page === 'api' ? apiPage() : specPage()}</div></div>${lightbox()}`;

    const nextList = document.querySelector('.message-list');
    if (nextList) {
        const stick = scrollToBottom || nearBottom;
        nextList.scrollTop = stick ? nextList.scrollHeight : prevTop;
        // 图片解码后高度才确定，贴底时再滚一次
        if (stick) for (const img of nextList.querySelectorAll('img')) if (!img.complete) img.addEventListener('load', () => { nextList.scrollTop = nextList.scrollHeight; }, { once: true });
    }
    scrollToBottom = false;
    const nextContent = document.querySelector('.content');
    if (nextContent && prevPage === S.page) nextContent.scrollTop = prevContentTop;
    if (focusPrompt) {
        const ta = document.getElementById('prompt-input');
        if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
        focusPrompt = false;
    }
    autoGrow();
}

function protoBar() {
    const tab = (id, label) => `<button class="${S.page === id ? 'active' : ''}" data-act="page" data-page="${id}">${label}</button>`;
    return `<div class="proto-bar"><strong>原型 · 会话内图片生成</strong>
        <div class="proto-tabs">${tab('chat', '聊天页')}${tab('api', 'API 页 · 图片模型')}${tab('spec', '交互说明')}</div>
        <label>状态模拟 <select data-act-change="sim">
            ${[['normal', '正常'], ['unconfigured', '未配置图片模型'], ['textCompletion', '主连接是文本补全'], ['fail', '下次生图失败'], ['unknown', '下次生图结果未知']]
                .map(([v, l]) => `<option value="${v}" ${S.sim === v ? 'selected' : ''}>${l}</option>`).join('')}

}

function topbar() {

function selectionBanner() {

const formatText = t => t.split('\n').map(line => `<p>${esc(line).replace(/\*(.+?)\*/g, '<em>$1</em>')}</p>`).join('');

function messageView(m) {
    if (m.image) return imageMessageView(m);
    const sel = selectionActive();
    const checked = S.selected.has(m.id);
    return `<article class="message ${m.user ? 'user' : ''} ${sel ? 'selectable' : ''} ${sel && checked ? 'selected' : ''}" ${sel ? `data-act="toggle-msg" data-id="${m.id}"` : ''}>
        <div class="message-meta"><span class="meta-left">${sel ? `<span class="checkbox">${ic('check')}</span>` : ''}<strong>${esc(m.name)}</strong><span>${m.time}</span></span>
            ${sel ? '' : `<span class="message-actions"><button class="ghost-button">${ic('edit', 'sm')}</button></span>`}</div>
        <div class="message-body">${formatText(m.text)}</div>
        ${m.model ? `<div class="message-foot"><span style="font-family:var(--mono)">${m.model}</span></div>` : ''}
    </article>`;
}

function imageMessageView(m) {
    const sel = selectionActive();
    const v = m.variants[m.vi];
    const regen = S.regenId === m.id;
    const media = v.media.length > 1
        ? `<div class="media-grid">${v.media.map((x, i) => `<img src="${paint(x.seed, x.ratio)}" alt="生成图片" data-act="open-lightbox" data-id="${m.id}" data-index="${i}">`).join('')}</div>`
        : `<img src="${paint(v.media[0].seed, v.media[0].ratio)}" alt="生成图片" data-act="open-lightbox" data-id="${m.id}" data-index="0">`;
    const del = S.confirmDelete === m.id
        ? `<span class="delete-confirm">删除这条图片消息？图片文件会保留在图片目录。<button class="secondary-button small danger" data-act="confirm-delete" data-id="${m.id}">${ic('trash', 'sm')}删除</button><button class="secondary-button small" data-act="cancel-delete">取消</button></span>`
        : `<button class="ghost-button danger" data-act="delete-msg" data-id="${m.id}" ${jobBusy() ? 'disabled' : ''}>${ic('trash', 'sm')}删除</button>`;
    return `<article class="message image-message ${sel ? 'dimmed' : ''}" ${sel ? 'title="图片消息不参与生成提示词"' : ''}>
        <div class="message-meta"><span class="meta-left"><strong>${esc(m.name)}</strong><span class="tag mini accent">${ic('image', 'sm')}图片</span><span class="tag mini" title="保存为 is_system 消息，后续文本回复看不到它">${ic('eyeoff', 'sm')}不进入上下文</span></span>
            <span class="meta-left">${m.variants.length > 1 ? `<span class="variant-switch"><button class="icon-button mini" data-act="variant" data-id="${m.id}" data-dir="-1" ${m.vi === 0 ? 'disabled' : ''}>${ic('chev-left', 'sm')}</button>${m.vi + 1}/${m.variants.length}<button class="icon-button mini" data-act="variant" data-id="${m.id}" data-dir="1" ${m.vi === m.variants.length - 1 ? 'disabled' : ''}>${ic('chev-right', 'sm')}</button></span>` : ''}<span>${m.time}</span></span></div>
        <div class="media-frame">${media}${regen ? `<div class="media-overlay"><span style="display:inline-flex;gap:8px;align-items:center"><span class="spinner-ring"></span>正在生成新版本 · <span class="job-elapsed">0</span> 秒</span></div>` : ''}</div>
        <details class="prompt-details"><summary>${ic('chev-right', 'sm chev')}提示词${m.source ? ` · ${esc(m.source)}` : ''}</summary><div class="prompt-text">${esc(m.prompt)}</div></details>
        <div class="image-info">${esc(v.info)}</div>
        ${sel ? '' : `<div class="image-actions">
            <button class="ghost-button" data-act="regen-image" data-id="${m.id}" ${jobBusy() || textBusy() ? 'disabled' : ''}>${ic('refresh', 'sm')}重新生成</button>
            <button class="ghost-button" data-act="edit-prompt" data-id="${m.id}">${ic('edit', 'sm')}编辑提示词</button>
            <button class="ghost-button" data-act="copy-prompt" data-id="${m.id}">${ic('copy', 'sm')}复制提示词</button>
            <button class="ghost-button" data-act="download">${ic('download', 'sm')}下载</button>
            ${del}</div>`}
    </article>`;
}

function streamingView() {
    if (!S.streaming) return '';
    return `<article class="message message-streaming"><div class="message-meta"><span class="meta-left"><strong>莉亚</strong><span>${now()}</span></span></div>
        <div class="message-body"><p class="stream-text" id="stream-text">${esc(S.streaming.text)}</p></div></article>`;
}

function jobView() {
    const j = S.job;
    if (!j) return '';
    const head = `<div class="message-meta"><span class="meta-left"><strong>莉亚</strong><span class="tag mini accent">${ic('image', 'sm')}图片</span></span><span>${j.time}</span></div>`;
    if (j.status === 'pending') {
        const width = 340, height = Math.min(360, Math.round(width * j.ratio));
        return `<article class="message image-message job-card">${head}
            <div class="skeleton" style="height:${height}px"><div>${ic('brush', 'lg')}<div style="margin-top:6px">正在生成 · 已等待 <span class="job-elapsed">0</span> 秒</div><div style="font-size:12px">${esc(j.info)}</div></div></div>
            <div class="image-actions"><button class="ghost-button" data-act="cancel-job">${ic('x', 'sm')}停止等待</button><span class="param-note">停止只是不再等待；已提交的请求，供应商可能照常计费。</span></div></article>`;
    }
    if (j.status === 'failed') {
        return `<article class="message image-message job-card failed">${head}
            <div class="job-title">${ic('alert')}图片生成失败</div>
            <div class="job-text">供应商返回 400：提示词触发了内容安全策略（moderation_blocked）。这次没有写入聊天文件。</div>
            <div class="image-actions"><button class="ghost-button" data-act="edit-job">${ic('edit', 'sm')}编辑提示词</button><button class="ghost-button" data-act="retry-job">${ic('refresh', 'sm')}重试</button><button class="ghost-button" data-act="dismiss-job">${ic('x', 'sm')}移除</button></div></article>`;
    }
    return `<article class="message image-message job-card unknown">${head}
        <div class="job-title">${ic('clock')}结果未知</div>
        <div class="job-text">等待超过 10 分钟仍无响应，连接已断开。供应商可能已经生成并计费。若图片已生成，会出现在 <code>/user/images/莉亚/</code>；这里不会自动重试。</div>
        <div class="image-actions"><button class="ghost-button" data-act="retry-job">${ic('refresh', 'sm')}重新提交（会再次计费）</button><button class="ghost-button" data-act="dismiss-job">${ic('x', 'sm')}移除</button></div></article>`;
}

/* ---------- 渲染：输入框 ---------- */
function composer() {
    const imageMode = S.composerMode === 'image';
    return `<div class="composer ${imageMode ? 'image-mode' : ''}">
        ${imageMode ? imageComposerBody() : textComposerBody()}
        <div class="composer-meta">
            <div class="segmented-control compact mode-toggle">
                <button class="${!imageMode ? 'active' : ''}" data-act="composer-mode" data-mode="text">${ic('message', 'sm')}文本</button>
                <button class="${imageMode ? 'active' : ''}" data-act="composer-mode" data-mode="image">${ic('image', 'sm')}图片</button>
            </div>
            ${imageMode
                ? (configured() ? `<button class="connection-chip image" data-act="chip">${ic('brush', 'sm')}<span>${esc(P().label)} · ${esc(S.model)}</span>${ic(S.chipOpen ? 'chev-down' : 'chev-up', 'sm')}</button>` : `<span class="connection-chip"><span class="dot muted"></span>未配置图片模型</span>`)
                : `<button class="connection-chip">${ic('plug', 'sm')}<span>Custom OpenAI-compatible · deepseek-v4-flash</span>${ic('chev-up', 'sm')}</button>`}
            <span class="usage">${imageMode ? '图片按次计费，生成前不预估费用' : '上次回复 312 tokens'}</span>
        </div>
        ${imageMode && S.chipOpen && configured() ? chipPopover() : ''}
    </div>`;
}

function textComposerBody() {
    const lock = jobBusy();
    const busy = textBusy();
    return `<div class="composer-row text-mode-row">
            <textarea data-model="textDraft" placeholder="输入消息，按 Ctrl/⌘ + Enter 发送" ${lock ? 'disabled' : ''}>${esc(S.textDraft)}</textarea>
            <div class="composer-buttons">
                ${busy ? `<button class="secondary-button danger" data-act="stop-text">${ic('stop')}停止</button>`
                    : `<button class="primary-button" data-act="send-text" ${lock ? 'disabled' : ''}>${ic('send')}发送</button>`}
                <button class="secondary-button" ${lock || busy ? 'disabled' : ''}>${ic('play')}继续</button>
                <button class="secondary-button" ${lock || busy ? 'disabled' : ''}>${ic('refresh')}重生成</button>
            </div></div>
        ${lock ? `<div class="composer-status warn">${ic('clock', 'sm')}图片生成中，完成或停止等待后才能发送文本。</div>` : ''}`;
}

function imageComposerBody() {
    if (!configured()) {
        return `<div class="empty-composer"><div class="icon-wrap">${ic('brush')}</div><div><b>还没有配置图片模型</b><p>图片模型和文本模型分开配置。先到 API 页的「图片模型」填写供应商、模型和密钥。</p></div>
            <button class="primary-button" data-act="go-api">${ic('plug')}去配置图片模型</button></div>`;
    }
    const autoDisabled = S.sim === 'textCompletion';
    const top = `<div class="composer-top">
        <div class="segmented-control compact">
            <button class="${S.imageSub === 'manual' ? 'active' : ''}" data-act="image-sub" data-sub="manual">${ic('edit', 'sm')}手动输入</button>
            <button class="${S.imageSub === 'auto' ? 'active' : ''}" data-act="image-sub" data-sub="auto" ${autoDisabled ? 'title="主连接是文本补全，暂不支持"' : ''}>${ic('spark', 'sm')}从消息生成</button>
        </div>
        <span class="hint">${S.imageSub === 'manual' ? '自己写提示词，生成后作为一条「仅展示」消息插入当前会话。' : '勾选消息 → 用文本模型生成提示词 → 自动填入提示词框后再生成图片。'}</span></div>`;
    if (S.imageSub === 'manual') return top + promptArea();
    if (autoDisabled) {
        return top + `<div class="progress-box">${ic('info')}<span>当前主连接是<b>文本补全</b>，第一期只支持在<b>聊天补全</b>连接上从消息生成提示词。可以切到「手动输入」自己写。</span></div>`;
    }
    return top + stepper() + (S.autoStep === 1 ? selectStep() : S.autoStep === 2 ? generatingStep() : promptArea(true));
}

function stepper() {
    const st = n => (S.autoStep === n ? 'active' : S.autoStep > n ? 'done' : '');
    const num = n => (S.autoStep > n ? ic('check', 'sm') : n);
    return `<div class="stepper"><span class="step ${st(1)}"><span class="num">${num(1)}</span>勾选消息</span><span class="step-line"></span>
        <span class="step ${st(2)}"><span class="num">${num(2)}</span>生成提示词</span><span class="step-line"></span>
        <span class="step ${st(3)}"><span class="num">3</span>确认并生成图片</span></div>`;
}

function selectStep() {
    const picked = textMessages().filter(m => S.selected.has(m.id));
    const chars = picked.reduce((n, m) => n + m.text.length, 0);
    const over = picked.length > 20 || chars > 6000;
    const blocked = textBusy();
    return `<div class="select-box"><div>
            <div class="select-summary">在上方消息列表里勾选要参考的消息 · 已选 <strong>${picked.length}</strong> 条，约 ${chars} 字</div>
            <div class="select-tools">快速选择
                <button class="secondary-button small" data-act="quick-select" data-n="1">最近 1 条</button>
                <button class="secondary-button small" data-act="quick-select" data-n="3">最近 3 条</button>
                <button class="secondary-button small" data-act="quick-select" data-n="5">最近 5 条</button>
                <button class="ghost-button" data-act="quick-select" data-n="0">清空</button>
                <span style="width:10px"></span>
                <span class="switch ${S.includeAppearance ? 'on' : ''}" data-act="toggle-appearance"><span class="knob"></span>附带角色外貌（取角色卡描述）</span>
            </div>
            ${over ? '<div class="field-hint warn">最多参考 20 条、6000 字，请减少勾选。</div>' : ''}
            ${blocked ? '<div class="field-hint warn">文本回复生成中，结束后才能生成提示词。</div>' : ''}
        </div>
        <button class="primary-button" data-act="gen-prompt" ${picked.length === 0 || over || blocked ? 'disabled' : ''}>${ic('spark')}生成提示词${ic('arrow-right', 'sm')}</button></div>`;
}

function generatingStep() {
    return `<div class="progress-box"><span class="spinner-ring"></span><span>正在用 <b>deepseek-v4-flash</b> 根据 ${S.selected.size} 条消息${S.includeAppearance ? '和角色外貌' : ''}生成图片提示词……不会写入聊天记录。</span>
        <button class="secondary-button small" data-act="cancel-prompt" style="margin-left:auto">${ic('x', 'sm')}取消</button></div>`;
}

function promptArea(fromAuto = false) {
    const p = P();
    const busy = jobBusy();
    const blocked = textBusy();
    const disabled = busy || blocked || !S.prompt.trim();
    const sel = (key, opts) => `<label class="param">${PARAM_LABEL[key]}<select data-act-change="param" data-key="${key}">${opts.map(([v, l]) => `<option value="${v}" ${String(S[key]) === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>`;
    const chips = [];
    if (p.params.includes('size')) chips.push(sel('size', p.sizes));
    if (p.params.includes('aspect')) chips.push(sel('aspect', p.aspects));
    if (p.params.includes('quality')) chips.push(sel('quality', p.qualities));
    if (p.params.includes('count')) chips.push(sel('count', Array.from({ length: p.countMax }, (_, i) => [String(i + 1), `${i + 1} 张`])));
    if (p.params.includes('style')) chips.push(sel('style', p.styles));
    const hasAdvanced = ['negative', 'seed', 'steps'].some(k => p.params.includes(k));
    const unsupported = ALL_PARAMS.filter(k => !p.params.includes(k) && !(k === 'size' && p.params.includes('aspect')) && !(k === 'aspect' && p.params.includes('size')));
    return `${fromAuto ? `<div class="prompt-source"><span class="tag mini accent">${ic('spark', 'sm')}由 ${S.promptFrom} 条消息生成</span>可以直接修改；确认后点「生成图片」。
            <button class="ghost-button" data-act="regen-prompt">${ic('refresh', 'sm')}重新生成提示词</button><button class="ghost-button" data-act="back-select">${ic('arrow-left', 'sm')}返回勾选</button></div>` : ''}
        <div class="composer-row">
            <textarea id="prompt-input" data-model="prompt" placeholder="描述想生成的画面，例如：月光下的屋顶，银发少女倚着栏杆，远处城市灯火，动漫插画风格">${esc(S.prompt)}</textarea>
            <div class="composer-buttons">
                <button class="primary-button" data-act="generate" id="generate-btn" ${disabled ? 'disabled' : ''}>${busy ? '<span class="spinner-ring" style="border-top-color:#fff"></span>生成中' : `${ic('brush')}生成图片`}</button>
                <button class="secondary-button" data-act="clear-prompt" ${busy ? 'disabled' : ''}>清空</button>
            </div></div>

function specPage() {
    return `<div class="content" data-page-key="spec"><div class="spec">

    <section class="panel"><h2>1. 入口：输入框加「文本 / 图片」切换</h2>
        <ul>
            <li>位置在输入框下方元信息行的最左边，紧挨连接标签。默认「文本」，行为和现在完全一样。</li>
            <li>切到「图片」后，输入框变成图片提示词框，右侧按钮换成「生成图片」「清空」；连接标签换成图片模型标签（如「OpenAI · gpt-image-1」），点开能看配置摘要并跳到 API 页。</li>

        </ul></section>

    <section class="panel"><h2>2. 手动输入</h2>
        <ol>
            <li>写提示词。</li>
            <li>按需调参数：尺寸或比例、质量、数量、风格；「高级」里是反向提示词、种子、步数。只显示当前供应商支持的参数，不支持的在行尾列出；默认值来自 API 页。</li>
            <li>点「生成图片」或按 Ctrl/⌘ + Enter。</li>
            <li>消息列表末尾出现「生成中」卡片（按所选比例占位、显示已等待秒数和「停止等待」）。成功后原位变成图片消息并写入聊天文件。提示词留在输入框，方便微调后再生成。</li>
        </ol></section>

    <section class="panel"><h2>3. 从消息生成（三步）</h2>
        <h3>① 勾选消息</h3>
        <ul>
            <li>切到「从消息生成」后，消息列表进入勾选状态：每条文本消息左上出现复选框，点消息任意位置切换勾选；默认勾选最近 3 条（API 页可改）。</li>
            <li>列表顶部出现提示条「正在勾选 · 已选 N 条 · 退出勾选（Esc）」。图片消息变淡、不能勾选。</li>
            <li>输入框区显示已选条数和字数、快速选择（最近 1 / 3 / 5 条、清空）、「附带角色外貌」开关和「生成提示词」按钮。没选或超过 20 条 / 6000 字时按钮不可用。</li>
        </ul>
        <h3>② 生成提示词</h3>
        <ul>
            <li>用当前文本连接调用一次，发送「模板 + 角色外貌 + 勾选的消息」。不写聊天文件，也不占用文本回复。</li>
            <li>期间显示进度和「取消」，勾选暂时锁定。失败时停在这一步，显示错误，可重试或返回勾选。</li>
        </ul>
        <h3>③ 确认并生成图片</h3>
        <ul>
            <li>提示词自动填进提示词框（和手动输入是同一个框），上方注明「由 N 条消息生成」，并提供「重新生成提示词」「返回勾选」。</li>
            <li>用户可以改提示词和参数，点「生成图片」后流程同手动输入。</li>
        </ul></section>

    <section class="panel"><h2>4. 图片消息</h2>
        <ul>
            <li>外观：角色一侧的卡片，标题带「图片」「不进入上下文」两个标签；图片按原比例显示，最高 360px，多张时两列网格；提示词默认折叠；底部一行写供应商、模型、尺寸、质量、耗时。</li>
            <li>操作：重新生成（同提示词同参数再出一张，作为这条消息的新版本，用 ‹ 1/2 › 切换）、编辑提示词（填回输入框并切到图片模式）、复制提示词、下载、删除（两步确认；只删聊天里的记录，图片文件留在图片目录）。</li>
            <li>点图片打开大图，右侧显示完整提示词、参数和文件路径。</li>
            <li>保存为 <code>is_system: true</code> 的消息，<code>extra.media</code> 里记 <code>url</code>、<code>title</code>（提示词）、<code>negative</code>、<code>source: 'generated'</code>；后续文本回复看不到它。</li>
        </ul></section>

    <section class="panel"><h2>5. 状态与互斥规则</h2>
        <table><tr><th style="width:34%">情况</th><th>表现</th></tr>
            <tr><td>文本回复生成中</td><td>「生成图片」「生成提示词」不可用，提示「结束后才能生成」。</td></tr>
            <tr><td>图片生成中</td><td>文本「发送」「继续」「重生成」不可用，状态行提示「图片生成中」；「生成图片」变成「生成中」。<span class="muted">（已确认）</span></td></tr>
            <tr><td>生成中切换会话或离开聊天页</td><td>弹确认：「图片仍在生成，离开后结果不会插入本会话（文件仍会保存到图片目录）」。</td></tr>
            <tr><td>停止等待</td><td>移除「生成中」卡片，提示「已停止等待；若供应商已开始生成，可能仍会计费」。</td></tr>
            <tr><td>供应商明确报错</td><td>卡片变红，显示供应商返回的错误，提供「编辑提示词」「重试」「移除」；不写聊天文件。</td></tr>
            <tr><td>超时、断网或 5xx</td><td>卡片变黄「结果未知」，说明可能已计费、给出图片目录路径，提供「重新提交（会再次计费）」「移除」；从不自动重试。</td></tr>
            <tr><td>未配置图片模型</td><td>切到「图片」显示空状态和「去配置图片模型」。</td></tr>
            <tr><td>主连接是文本补全</td><td>「从消息生成」里说明暂不支持，手动输入照常可用。</td></tr>
        </table></section>

    <section class="panel"><h2>6. API 页：图片模型</h2>
        <ul>
            <li>页头下新增「文本模型 / 图片模型」切换，「文本模型」就是现在的页面，不改。</li>
            <li>图片模型左侧：当前配置摘要、连接（供应商、地址、模型 + 常用模型）、默认参数（随供应商变化，不支持的置灰并写原因）、安全密钥（只写不读）、「试生成一张」（两步确认，会计费）、「保存图片模型」。</li>
            <li>右侧：配置诊断（供应商支持、模型、密钥、可用参数、最近一次检查、最近 5 次生成）；下方「从消息生成提示词」设置（使用的文本模型、模板、默认勾选条数、是否附带角色外貌）。</li>
            <li>「检查配置」只校验参数和供应商是否支持，不出图、不计费。</li>
            <li>第一期供应商：OpenAI、OpenAI 兼容、Google Gemini / Imagen、OpenRouter、NovelAI、本地 SD WebUI。</li>
        </ul></section>

    <section class="panel"><h2>7. 本期不做</h2>
        <ul><li>多套图片配置之间切换；把图片作为模型输入（看图回复）；Agent 会话页接入；Horde、ComfyUI 这类排队任务中断后恢复；移动端布局。</li></ul></section>

    <section class="panel"><h2>8. 已确认（2026-10-11）</h2>
        <ol>
            <li>图片生成期间不允许继续发文本。</li>
            <li>「重新生成」做成同一条消息的多个版本，用 ‹ 1/2 › 切换。</li>
            <li>图片消息固定不进入上下文，不加「加入上下文」开关。</li>
            <li>自动模式默认勾选最近 3 条。</li>
            <li>群聊里「附带角色外貌」取勾选消息中出现的所有角色。</li>
        </ol></section>
    </div></div>`;
}

function lightbox() {

    const m = S.messages.find(x => x.id === S.lightbox.id);

    const media = v.media[S.lightbox.index] ?? v.media[0];
    return `<div class="lightbox" data-act="close-lightbox"><div class="lightbox-stage"><img src="${paint(media.seed, media.ratio)}" alt="大图"></div>
        <div class="lightbox-side" data-stop="1"><div style="display:flex;justify-content:space-between;align-items:center"><h3>图片详情</h3><button class="icon-button" data-act="close-lightbox">${ic('x')}</button></div>
            <div><span class="field-label">提示词</span><div class="prompt-text">${esc(m.prompt)}</div></div>
            <div class="kv"><span>来源</span><span>${esc(m.source ?? '手动输入')}</span><span>参数</span><span>${esc(v.info)}</span><span>文件</span><span style="font-family:var(--mono);font-size:12px;word-break:break-all">/user/images/莉亚/莉亚_2026-10-11@22h04m.png</span></div>
            <div class="actions"><button class="secondary-button" data-act="copy-prompt" data-id="${m.id}">${ic('copy')}复制提示词</button><button class="secondary-button" data-act="edit-prompt" data-id="${m.id}">${ic('edit')}编辑提示词</button><button class="primary-button" data-act="download">${ic('download')}下载</button></div>
        </div></div>`;
}

/* ---------- 行为 ---------- */
let toastTimer;
function toast(text) {
    document.querySelector('.toast')?.remove();
    const el = document.createElement('div'); el.className = 'toast'; el.textContent = text;
    document.body.appendChild(el);
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 3200);
}
function autoGrow() {
    for (const ta of document.querySelectorAll('.composer textarea')) { ta.style.height = 'auto'; ta.style.height = `${Math.min(200, ta.scrollHeight + 2)}px`; }
}
function selectRecent(n) {
    S.selected = new Set(textMessages().slice(-n).map(m => m.id));
}
let elapsedTimer;
function startElapsed() {
    const t0 = Date.now();
    clearInterval(elapsedTimer);
    elapsedTimer = setInterval(() => { for (const el of document.querySelectorAll('.job-elapsed')) el.textContent = Math.floor((Date.now() - t0) / 1000); }, 250);
}
function snapshotInfo() {
    const p = P();
    return `${p.label} · ${S.model} · ${sizeLabel()}${p.params.includes('quality') ? ' · ' + qualityLabel() + '质量' : ''}`;
}

function startGenerate(prompt) {
    if (!configured()) return toast('还没有配置图片模型');
    if (textBusy()) return toast('文本回复生成中，结束后才能生成图片');
    if (jobBusy()) return;
    if (!prompt.trim()) return toast('先写提示词');
    const ratio = ratioOf();
    const count = P().params.includes('count') ? Number(S.count) : 1;
    const outcome = S.sim === 'fail' ? 'failed' : S.sim === 'unknown' ? 'unknown' : 'ok';
    S.job = { status: 'pending', time: now(), ratio, info: snapshotInfo(), prompt, count, from: S.composerMode === 'image' && S.imageSub === 'auto' ? S.promptFrom : 0 };
    scrollToBottom = true; render(); startElapsed();
    const started = Date.now();
    setTimeout(() => {
        if (!S.job || S.job.status !== 'pending') return;
        clearInterval(elapsedTimer);
        const secs = Math.round((Date.now() - started) / 1000) + 14;
        if (outcome === 'failed') { S.job.status = 'failed'; S.history.unshift({ time: now(), ok: false, text: '失败 · 供应商返回 400' }); }
        else if (outcome === 'unknown') { S.job.status = 'unknown'; S.history.unshift({ time: now(), ok: false, text: '结果未知 · 超时' }); }
        else {
            const seedBase = Math.floor(Math.random() * 1e6);
            S.messages.push({ id: ++uid, image: true, name: '莉亚', time: S.job.time, prompt, source: S.job.from ? `由 ${S.job.from} 条消息生成` : '手动输入',
                variants: [{ media: Array.from({ length: S.job.count }, (_, i) => ({ seed: seedBase + i, ratio })), info: `${S.job.info} · 耗时 ${secs} 秒` }], vi: 0 });
            S.history.unshift({ time: now(), ok: true, text: `成功 · ${secs} 秒 · ${sizeLabel()}` });
            S.job = null;
            toast('图片已插入会话（不进入后续文本上下文）');
        }
        scrollToBottom = true; render();
    }, 3600);
}

function startPromptGeneration() {
    if (textBusy()) return toast('文本回复生成中，结束后才能生成提示词');
    S.autoStep = 2; render();
    setTimeout(() => {
        if (S.autoStep !== 2) return;
        S.prompt = GENERATED_PROMPT; S.promptFrom = S.selected.size; S.autoStep = 3; focusPrompt = true; render();
    }, 1800);
}

const REPLY = '*她把披风拉紧了一些，靠得更近，月光落在你们之间的栏杆上。*\n这样就不冷了。等风停了，我带你去看河对岸的灯船。';
function startStreaming(userText) {
    if (userText) S.messages.push({ id: ++uid, user: true, name: '你', time: now(), text: userText });
    S.streaming = { text: '', i: 0 };
    scrollToBottom = true; render();
    const timer = setInterval(() => {
        if (!S.streaming) return clearInterval(timer);
        S.streaming.i += 2; S.streaming.text = REPLY.slice(0, S.streaming.i).replace(/\*/g, '');
        const el = document.getElementById('stream-text'); if (el) el.textContent = S.streaming.text;
        const list = document.querySelector('.message-list'); if (list) list.scrollTop = list.scrollHeight;
        if (S.streaming.i >= REPLY.length) {
            clearInterval(timer);
            S.messages.push({ id: ++uid, name: '莉亚', time: now(), model: 'deepseek-v4-flash', text: REPLY });
            S.streaming = null; scrollToBottom = true; render();
        }
    }, 70);
}

const actions = {
    page: t => { S.page = t.dataset.page; S.chipOpen = false; render(); },
    theme: () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; render(); },
    'composer-mode': t => {
        S.composerMode = t.dataset.mode; S.chipOpen = false;
        if (S.composerMode === 'image' && S.imageSub === 'auto' && S.autoStep === 1 && S.selected.size === 0) selectRecent(S.defaultSelectCount);
        scrollToBottom = true; render();
    },
    'image-sub': t => {
        S.imageSub = t.dataset.sub;
        if (S.imageSub === 'auto' && S.autoStep === 1 && S.selected.size === 0) selectRecent(S.defaultSelectCount);
        scrollToBottom = true; render();
    },
    'exit-select': () => { S.imageSub = 'manual'; render(); },
    'toggle-msg': t => { const id = Number(t.dataset.id); S.selected.has(id) ? S.selected.delete(id) : S.selected.add(id); render(); },
    'quick-select': t => { const n = Number(t.dataset.n); n ? selectRecent(n) : S.selected.clear(); render(); },
    'toggle-appearance': () => { S.includeAppearance = !S.includeAppearance; render(); },
    'gen-prompt': () => startPromptGeneration(),
    'regen-prompt': () => { S.autoStep = 1; startPromptGeneration(); },
    'cancel-prompt': () => { S.autoStep = 1; toast('已取消生成提示词'); render(); },
    'back-select': () => { S.autoStep = 1; render(); },
    generate: () => startGenerate(S.prompt),
    'clear-prompt': () => { S.prompt = ''; render(); },
    'toggle-advanced': () => { S.showAdvanced = !S.showAdvanced; render(); },
    chip: () => { S.chipOpen = !S.chipOpen; render(); },
    'go-api': () => { S.page = 'api'; S.apiTab = 'image'; S.chipOpen = false; render(); },
    'cancel-job': () => { S.job = null; clearInterval(elapsedTimer); toast('已停止等待；若供应商已开始生成，可能仍会计费'); render(); },
    'dismiss-job': () => { S.job = null; render(); },
    'retry-job': () => { const p = S.job.prompt; S.job = null; startGenerate(p); },
    'edit-job': () => { S.prompt = S.job.prompt; S.job = null; S.composerMode = 'image'; S.imageSub = 'manual'; focusPrompt = true; render(); },
    'edit-prompt': t => { const m = S.messages.find(x => x.id === Number(t.dataset.id)); S.prompt = m.prompt; S.composerMode = 'image'; S.imageSub = 'manual'; S.lightbox = null; S.page = 'chat'; focusPrompt = true; render(); },
    'copy-prompt': t => { const m = S.messages.find(x => x.id === Number(t.dataset.id)); navigator.clipboard?.writeText(m.prompt).catch(() => {}); toast('已复制提示词'); },
    download: () => toast('（原型）下载 /user/images/莉亚/ 下对应的 PNG 文件'),
    'delete-msg': t => { S.confirmDelete = Number(t.dataset.id); render(); },
    'cancel-delete': () => { S.confirmDelete = null; render(); },
    'confirm-delete': t => { S.messages = S.messages.filter(m => m.id !== Number(t.dataset.id)); S.confirmDelete = null; toast('已从聊天中删除；图片文件仍在图片目录'); render(); },
    'regen-image': t => {
        if (textBusy()) return toast('文本回复生成中，结束后才能生成图片');
        const id = Number(t.dataset.id); S.regenId = id; render(); startElapsed();
        setTimeout(() => {
            const m = S.messages.find(x => x.id === id); clearInterval(elapsedTimer);
            if (m) { const base = m.variants[m.vi]; m.variants.push({ media: base.media.map(x => ({ seed: Math.floor(Math.random() * 1e6), ratio: x.ratio })), info: base.info.replace(/耗时 \d+ 秒/, `耗时 ${15 + Math.floor(Math.random() * 10)} 秒`) }); m.vi = m.variants.length - 1; }
            S.regenId = null; toast('已生成新版本，可用 ‹ › 切换'); render();
        }, 3000);
    },
    variant: t => { const m = S.messages.find(x => x.id === Number(t.dataset.id)); m.vi = Math.max(0, Math.min(m.variants.length - 1, m.vi + Number(t.dataset.dir))); render(); },
    'open-lightbox': t => { S.lightbox = { id: Number(t.dataset.id), index: Number(t.dataset.index) }; render(); },
    'close-lightbox': (t, e) => { if (e.target.closest('[data-stop]') && !e.target.closest('[data-act="close-lightbox"].icon-button')) return; S.lightbox = null; render(); },
    'send-text': () => { const text = S.textDraft.trim(); if (!text) return toast('先输入消息'); S.textDraft = ''; startStreaming(text); },
    'stop-text': () => { S.streaming = null; toast('已停止'); render(); },
    'api-tab': t => { S.apiTab = t.dataset.tab; render(); },
    'check-config': () => { S.checked = true; toast('检查通过：参数合法，供应商支持当前组合（未出图、未计费）'); render(); },
    'test-generate': () => { if (!S.testConfirm) { S.testConfirm = true; render(); return; } S.testConfirm = false; toast('（原型）已提交一次试生成，按次计费'); render(); },
    'save-config': () => { if (S.sim === 'unconfigured') S.sim = 'normal'; toast('图片模型已保存'); render(); },
    'pick-model': t => { S.model = t.dataset.modelName; render(); },
};

document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    if (!t || t.disabled) return;
    if (t.dataset.act === 'toggle-msg' && e.target.closest('button')) return;
    const fn = actions[t.dataset.act];
    if (fn) fn(t, e);
});
document.addEventListener('change', e => {
    const t = e.target;
    const kind = t.dataset.actChange;
    if (!kind) return;
    if (kind === 'sim') {
        S.sim = t.value;
        if (S.sim === 'textCompletion' && S.imageSub === 'auto') S.autoStep = 1;
        toast({ normal: '已切回正常状态', unconfigured: '模拟：还没有配置图片模型', textCompletion: '模拟：主连接是文本补全', fail: '模拟：下一次生图会失败', unknown: '模拟：下一次生图会超时，结果未知' }[S.sim]);
    } else if (kind === 'param') { S[t.dataset.key] = t.value; }
    else if (kind === 'provider') {
        S.provider = t.value; const p = P();
        S.model = p.models[0]; if (p.sizes) S.size = p.sizes[0][0]; if (p.aspects) S.aspect = p.aspects[0][0];
        if (p.qualities) S.quality = p.qualities[p.qualities.length - 1][0]; S.count = '1'; S.style = '';
    } else if (kind === 'default-count') { S.defaultSelectCount = Number(t.value); }
    render();
});
document.addEventListener('input', e => {
    const key = e.target.dataset.model;
    if (!key) return;
    S[key] = e.target.value;
    if (key === 'prompt') { const btn = document.getElementById('generate-btn'); if (btn) btn.disabled = jobBusy() || textBusy() || !S.prompt.trim(); }
    if (e.target.closest('.composer')) autoGrow();
});
document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        if (e.target.id === 'prompt-input') { e.preventDefault(); startGenerate(S.prompt); }
        else if (e.target.dataset?.model === 'textDraft') { e.preventDefault(); actions['send-text'](); }
    }
    if (e.key === 'Escape') {
        if (S.lightbox) { S.lightbox = null; render(); }
        else if (S.chipOpen) { S.chipOpen = false; render(); }
        else if (selectionActive()) { S.imageSub = 'manual'; render(); }
    }
});
render();
</script>
</body>
